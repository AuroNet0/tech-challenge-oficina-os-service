services:
  postgres:
    image: postgres:17-alpine
    container_name: oficina-os-postgres
    environment:
      POSTGRES_DB: oficina_os
      POSTGRES_USER: oficina_os
      POSTGRES_PASSWORD: oficina_os
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina_os -d oficina_os"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: oficina-os-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  os-service:
    build:
      context: .
    container_name: oficina-os-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: oficina_os
      DB_USERNAME: oficina_os
      DB_PASSWORD: oficina_os
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:?Configure AUTH_JWT_ISSUER}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:?Configure AUTH_JWT_AUDIENCE}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI:?Configure AUTH_JWKS_URI}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  rabbitmq-data:
